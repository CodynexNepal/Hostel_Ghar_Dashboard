name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostel-ghar-dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_BACKEND_API_URL: ${{ secrets.NEXT_BACKEND_API_URL }}

      - name: Validate Next.js Build
        shell: bash
        run: |
          set -Eeuo pipefail

          for file in \
            ".next/BUILD_ID" \
            ".next/standalone/server.js" \
            ".next/required-server-files.json"
          do
            if [ ! -f "$file" ]; then
              echo "::error::Required build file is missing: $file"
              exit 1
            fi
          done

          echo "Next.js build ID:"
          cat .next/BUILD_ID

      - name: Prepare Standalone Bundle
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Preparing clean standalone deployment bundle..."

          rm -rf deploy-bundle deploy-bundle.tar.gz
          mkdir -p deploy-bundle

          # IMPORTANT: Copy hidden files and directories too.
          # Using .next/standalone/* would skip hidden .next directories.
          cp -a .next/standalone/. deploy-bundle/

          # Ensure the complete Next.js build metadata is present.
          mkdir -p deploy-bundle/.next

          if [ -d .next/static ]; then
            cp -a .next/static deploy-bundle/.next/
          else
            echo "::error::.next/static directory is missing"
            exit 1
          fi

          # Include public assets when the project has a public directory.
          if [ -d public ]; then
            cp -a public deploy-bundle/public
          fi

          # Include the cPanel Passenger startup wrapper.
          if [ -f app.js ]; then
            cp app.js deploy-bundle/app.js
          else
            echo "::error::app.js is missing from the repository"
            exit 1
          fi

          # Validate the actual bundle root.
          for file in \
            "deploy-bundle/server.js" \
            "deploy-bundle/app.js" \
            "deploy-bundle/package.json" \
            "deploy-bundle/.next/BUILD_ID" \
            "deploy-bundle/.next/required-server-files.json"
          do
            if [ ! -f "$file" ]; then
              echo "::error::Deployment bundle is missing: $file"
              exit 1
            fi
          done

          SOURCE_BUILD_ID="$(cat .next/BUILD_ID)"
          BUNDLE_BUILD_ID="$(cat deploy-bundle/.next/BUILD_ID)"

          if [ "$SOURCE_BUILD_ID" != "$BUNDLE_BUILD_ID" ]; then
            echo "::error::Source and bundle BUILD_ID values do not match"
            exit 1
          fi

          echo "Verified build ID: $BUNDLE_BUILD_ID"

          # Create the archive with files at the expected bundle root.
          tar -czf deploy-bundle.tar.gz -C deploy-bundle .

          # Verify the archive itself before uploading.
          tar -tzf deploy-bundle.tar.gz > bundle-contents.txt

          if ! grep -Eq '^\./?\.next/BUILD_ID$' bundle-contents.txt; then
            echo "::error::BUILD_ID is missing from the final archive"
            exit 1
          fi

          if ! grep -Eq '^\./?server\.js$' bundle-contents.txt; then
            echo "::error::server.js is missing from the final archive"
            exit 1
          fi

          echo "Bundle validation successful."
          echo "Bundle size:"
          du -h deploy-bundle.tar.gz

      - name: Setup SSH Key
        shell: bash
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -Eeuo pipefail

          if [ -z "${CPANEL_SSH_KEY:-}" ]; then
            echo "::error::GitHub secret CPANEL_SSH_KEY is empty or missing"
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$CPANEL_SSH_KEY" > "$RUNNER_TEMP/cpanel_key"
          chmod 600 "$RUNNER_TEMP/cpanel_key"

          if ! ssh-keygen -y -f "$RUNNER_TEMP/cpanel_key" > /dev/null; then
            echo "::error::CPANEL_SSH_KEY is not a valid private SSH key"
            exit 1
          fi

          cp "$RUNNER_TEMP/cpanel_key" "$HOME/.ssh/cpanel_key"
          chmod 600 "$HOME/.ssh/cpanel_key"

      - name: Execute Deployment Script
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || '22' }}
          SSH_KEY_PATH: ${{ runner.temp }}/cpanel_key
          BUNDLE_FILE: deploy-bundle.tar.gz
          APP_DIR: /home/hostelgh/hostelghar_dashboard
          BACKUP_DIR: /home/hostelgh/dashboard_backups
          REMOTE_TMP_DIR: /home/hostelgh/tmp_dashboard_deploy
          NODE_VENV_PATH: /home/hostelgh/nodevenv/hostelghar_dashboard/20
          HEALTH_URL: https://dashboard.hostelghar.com
          MAX_HEALTH_ATTEMPTS: 12
          HEALTH_SLEEP_SECONDS: 5
        run: |
          set -Eeuo pipefail
          bash scripts/deploy.sh --runner
